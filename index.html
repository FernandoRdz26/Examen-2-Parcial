<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recibo telefonico</title>
    <style>
        body{background:rgb(137, 229, 137); margin: 0 auto;}
        form{border: 2px solid black; width: fit-content; margin: 0 auto;}
        h1{text-align: center; text-shadow: -3px 4px 4px blue;}
        hr{height: 1px;}
        input,select{background: rgb(250, 250, 219); outline: none; border: none; 
            margin-top: 6px; margin-right: 6px; border-radius: 5px;}
        label{margin-right: 10px; margin-top: 3px;}
        input,select{transition: 0.5s ease;}
        input:hover{transform: scale(1.1);}
        select:hover{transform: scale(1.1);}
    </style>

    <script>
        alert('Hola mundo');
    </script>

</head>
<body>
    <hr color="black">
    <h1>Recibo telefonico</h1>
    <hr color="black">
    <form action="agradecimiento.html">
        <label for="minutos">Minutos de llamadas a celular: (1.00 c/u)</label>
        <input type="number" name="minutos" id="minutos" style="width: 50px;">
        <br>
        <hr color="black">
        <label for="plan">Tipo de plan:</label>
        <br>
        <label for="telefono">Solo telefono (200.00)</label><input type="radio" name="plan" id="plan" value="telefono">
        <br>
        <label for="tel_inter">Telefono + internet (450.00)</label> <input type="radio" name="plan" id="plan" value="telefono_internet">
        <br>
        <label for="tel_inter_tv">Telefono + internet + TV (850.00)</label>
        <input type="radio" name="plan" id="plan" value="telefono_internet_tv">
        <br>
        <hr color="black">
        <label for="servicios">Otros servicios:</label>
        <br>
        <label for="antivirus">Antivirus (30.00)</label>
        <input type="checkbox" name="servicios" id="servicios" value="antivirus">
        <br>
        <label for="nube">Servicio de nube (50.00)</label>
        <input type="checkbox" name="servicios" id="servicios" value="nube">
        <br>
        <label for="web">Servicios web (40.00)</label>
        <input type="checkbox" name="servicios" id="servicios" value="web">
        <br>
        <hr color="black">
        <label for="paquetes">Paquetes:</label>
        <br>
        <select name="paquetes" id="paquetes">
        <option value="">Seleccionar una opcion</option>
        <option value="residencial">residencial</option>
        <option value="ejecutivo">Ejecutivo</option>
        <option value="familiar">Familiar</option>
        <option value="sinlimites">Sin limites</option>
        </select>
        <br>
        <hr>
        <input type="submit" value="calcular recibo" style="margin-bottom: 8px;" 
            onclick="alert('Esto esta pagado')">
    </form>
    
    <script>
        console.log('Hola desde la consola del desarrollador');
    </script>

    <script src="java.js"></script>
</body>
</html>
